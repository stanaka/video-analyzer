[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "offline-video-analyzer"
version = "0.1.0"
description = "Offline MP4 transcription, speaker diarization, and Molmo2 scene descriptions"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "av>=16,<17",
  "huggingface-hub>=0.34,<1",
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "pydantic>=2.11,<3",
  "PyYAML>=6,<7",
  "scenedetect>=0.7.1,<0.8",
]

[project.scripts]
video-analyzer = "video_analyzer.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.55,<2",
    "pytest>=8.4,<10",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/video_analyzer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: uses FFmpeg and real video decoding",
  "models: opt-in local model inference",
  "browser: opt-in Playwright tests requiring installed browser binaries",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
