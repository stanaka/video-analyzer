min_version = "2026.9.16"

[tools]
python = ["3.11.15", "3.12.15"]
uv = "0.12.11"

[settings]
python.compile = false
python.uv_venv_auto = "source"

[env]
UV_CACHE_DIR = "{{ config_root }}/.uv-cache"
# mise owns Python installation; uv owns the CLI and optional worker environments.
UV_PYTHON = { value = "{{ tools.python[0].path }}/bin/python", tools = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "Install locked CLI and model worker environments for this platform"
run = "bash scripts/setup.sh"

[tasks."setup:mac"]
description = "Install locked CLI, PyTorch, and MLX environments on Apple Silicon"
run = "bash scripts/setup-mac.sh"

[tasks."setup:cuda"]
description = "Install locked CLI and PyTorch environments on x86_64 Linux"
run = "bash scripts/setup-cuda.sh"

[tasks."setup:dev"]
description = "Install CLI and test dependencies only, without model workers"
run = "uv sync --frozen"

[tasks."setup:sortformer"]
description = "Install the optional Sortformer v2.1 worker with Python 3.12"
run = "bash scripts/setup-sortformer.sh"

[tasks."setup:nemotron"]
description = "Install the optional Nemotron 3 worker with Python 3.12 and pinned NeMo source"
run = "bash scripts/setup-nemotron.sh"

# Runtime tasks deliberately have no setup dependency: they never install packages
# or download models implicitly. Arguments are forwarded to the underlying CLI.
[tasks.prepare-models]
description = "Explicitly download models using the saved hf login; pass --profile mac or cuda"
raw_args = true
run = ".venv/bin/video-analyzer prepare-models"

[tasks.doctor]
description = "Check local models, workers, FFmpeg, and accelerators offline"
raw_args = true
run = ".venv/bin/video-analyzer doctor"

[tasks.analyze]
description = "Analyze a local MP4 offline; pass the input path and CLI options"
raw_args = true
run = ".venv/bin/video-analyzer analyze"

[tasks.test]
description = "Run tests without loading real models"
run = ".venv/bin/python -m pytest -m 'not models and not browser'"

[tasks.export-html]
description = "Export an offline HTML viewer from a saved JSON analysis"
raw_args = true
run = ".venv/bin/video-analyzer export-html"

[tasks."setup:browser-tests"]
description = "Explicitly download Chromium for HTML viewer tests"
run = "PLAYWRIGHT_BROWSERS_PATH=.cache/playwright .venv/bin/python -m playwright install chromium"

[tasks."test:browser"]
description = "Test local HTML playback in Chromium (requires setup:browser-tests)"
run = "PLAYWRIGHT_BROWSERS_PATH=.cache/playwright .venv/bin/python -m pytest -m browser"

[tasks."test:models"]
description = "Run opt-in real-model tests with VIDEO_ANALYZER_MODEL_TEST_VIDEO"
run = ".venv/bin/python -m pytest -m models -s"

[tasks.lint]
description = "Check Python lint and formatting"
run = [
  ".venv/bin/python -m ruff check src tests",
  ".venv/bin/python -m ruff format --check src tests",
]

[tasks.check]
description = "Run lint, formatting, and tests"
depends = ["lint", "test"]

[tasks.build]
description = "Build the wheel and source distribution"
run = "uv build"
